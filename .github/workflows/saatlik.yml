name: Demo Botlari (XAU/XAG + AUDNZD) - 15dk

on:
  schedule:
    # DIKKAT - BU CRON GUVENILIR DEGIL, OLCULDU (19.08.2026):
    #
    # Tuhaf dakikalara (7/22/37/52) kaydirma, yuvarlak dakikalardaki
    # yigilmayi asmak icin yapilmisti - ama sorunu COZMEDI. 100 calistirma
    # incelendiginde (18.08 21:45 -> 19.08 19:00):
    #     beklenen cron tetiklemesi : ~88
    #     gerceklesen               :  14   (%16)
    #     iki tetikleme arasi ort.  :  93 dakika (en uzunu 202 dakika)
    #     tetiklenenler de :48 - :12 arasina dagilmis (20 dakikaya varan
    #     gecikme) - yani dakika secimi de tutmuyor
    #
    # Botlari fiilen ayakta tutan sey, ayni pencerede gelen 86 adet HARICI
    # workflow_dispatch cagrisi (:00/:15/:30/:45). Yani asil tetikleyici
    # bu depo DISINDA ve o kaynak durursa botlar gunde 96 yerine ~14 kez
    # calisir. Cron burada sadece YEDEK.
    #
    # Cron'a daha fazla satir eklemek denenebilirdi ama her ek tetikleme
    # MetaApi cagrisi demek; onun yerine "Calistirma saglik kontrolu"
    # adimi calistirmalar arasi boslugu olcup 45 dakikayi asinca Telegram'a
    # haber veriyor. Yani sessiz durus artik imkansiz.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      # Kapanis bildirimlerinin durum dosyasini calistirmalar arasinda tasir.
      # Her calistirma temiz bir makinede basladigi icin bu olmadan ayni
      # kapanis tekrar tekrar bildirilir. Cache'ler ayni anahtarla
      # guncellenemedigi icin anahtar run_id ile donduruluyor, restore-keys
      # ile de en son kaydedilen surum geri yukleniyor.
      - name: Bildirim durumunu geri yukle
        uses: actions/cache@v4
        with:
          path: |
            bildirilen_kapanislar*.json
            ozet_gonderildi*.json
            son_giris_bari_*.json
            son_kosum.json
            kayma_kaydi*.jsonl
            kagit_ab*.jsonl
            kagit_ab_acilis*.json
            kagit_ab_ozet*.json
          key: kapanis-durumu-${{ github.run_id }}
          restore-keys: |
            kapanis-durumu-

      - name: XAUUSD botunu calistir
        id: xau
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xau_main.py

      - name: XAGUSD botunu calistir
        id: xag
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xag_main.py

      # 05.08.2026: AUDNZD KALDIRILDI, yerine Donchian kirilim botu geldi.
      # AUDNZD 15.2 yillik veride maliyetler dahil -%51 yapiyordu ve hicbir
      # varyanti ileriye yuruyen testten gecmedi. Donchian, bu projede
      # butun dayaniklilik testlerinden gecen ilk kurulum - bkz.
      # donchian_bot.py docstring'i.
      - name: "[Hesap 2 - 10000 USD] Donchian kirilim botu (XAU+XAG, 4h)"
        id: donchian
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN_2 }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD_2 }}
          MT5_SERVER: ${{ secrets.MT5_SERVER_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HESAP_ETIKETI: "_hesap2"
        run: python donchian_main.py

      # AUDNZD icin SIFIRDAN kurulan ortalamaya donus sistemi.
      #
      # KENDI HESABINDA (hesap 3) calisir - Donchian ile ayni hesapta DEGIL.
      # Sebep: lot hesabi ozsermayeye dayaniyor (bakiye = hesap["equity"]) ve
      # ozsermaye acik pozisyonlarin anlik kar/zararini da icerir. Ayni
      # hesapta olsalardi Donchian'in acik kari AUDNZD'nin lotunu buyutur,
      # Donchian'in dususu kucultturdu. Marj havuzu ve dusus de ortak olurdu.
      # Ayri hesap = ayri ozsermaye, ayri marj, ayri dusus; iki sistemin
      # performansi birbirinden bagimsiz olculebilir.
      #
      # Iki bot BILINCLI olarak zit ailelerde: metaller kalici trend yapar,
      # AUDNZD dar bantta salinir (varyans orani 0.885-0.934).
      # Yedi indikator tek tek olculdu; MACD, RVI ve ADX bilgi TASIMIYOR
      # cikti - bkz. ortalama_donus_bot.py modul basligi.
      - name: "[Hesap 3 - 100k] AUDNZD ortalamaya donus (1h)"
        id: audnzd
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN_3 }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD_3 }}
          MT5_SERVER: ${{ secrets.MT5_SERVER_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HESAP_ETIKETI: "_hesap3"
        run: python audnzd_donus_main.py

      # KAGIT TAKIP - GERCEK EMIR GONDERMEZ.
      # A+B birlesik sistemi (XAUUSD 8 saatlik) hesap acmadan once canli
      # veriyle izleniyor. Hesap 1'in kimligiyle baglanir ama sadece FIYAT
      # okur; pozisyon acmaz/kapatmaz. Bkz. kagit_ab.py modul basligi.
      - name: "[KAGIT] A+B sistemi takip (XAUUSD 8h)"
        id: kagit
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kagit_ab_main.py

      # Ozetler gunde BIR KEZ gider - gunun ilk 12:00 UTC sonrasi
      # calistirmasinda. Tekrari, durum dosyasi (cache ile tasinan
      # ozet_gonderildi*.json) engelliyor.
      - name: "[Hesap 1 - 100k] Gunluk durum ozeti"
        id: ozet1
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OZET_SEMBOLLER: "XAGUSD,XAUUSD"
          OZET_BASLIK: "Gunluk durum - Metaller (100k)"
        run: python gunluk_ozet.py

      - name: "[Hesap 2 - 10k] Gunluk durum ozeti (Donchian)"
        id: ozet2
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN_2 }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD_2 }}
          MT5_SERVER: ${{ secrets.MT5_SERVER_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HESAP_ETIKETI: "_hesap2"
          OZET_SEMBOLLER: "XAUUSD,XAGUSD"
          OZET_BASLIK: "Gunluk durum - Donchian kirilim (10k)"
        run: python gunluk_ozet.py

      - name: "[Hesap 3 - 100k] Gunluk durum ozeti (AUDNZD donus)"
        id: ozet3
        continue-on-error: true
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN_3 }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD_3 }}
          MT5_SERVER: ${{ secrets.MT5_SERVER_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HESAP_ETIKETI: "_hesap3"
          OZET_SEMBOLLER: "AUDNZD"
          OZET_BASLIK: "Gunluk durum - AUDNZD ortalamaya donus (100k)"
        run: python gunluk_ozet.py

      # ADIM SONUCLARINI KONTROL ET - continue-on-error maskesini kaldirir.
      #
      # Yukaridaki bot adimlarinin hepsinde continue-on-error: true var ve
      # bu DOGRU: bir bot cokerse digerleri calismaya devam etmeli. Ama yan
      # etkisi, adim cokse bile isin YESIL gorunmesi - 19.08.2026'da Hesap
      # 3'un 8 gundur hic islem yapmadigi bu yuzden fark edilmedi.
      #
      # Bu adim `outcome` degerlerini (continue-on-error UYGULANMADAN
      # ONCEKI gercek sonuc) okur, hata varsa Telegram'a bildirir ve isi
      # KIRMIZI yapar. Botlar bu noktada zaten calismis olur.
      #
      # Ayrica bir onceki calistirmadan bu yana gecen sureyi olcer: cron
      # guvenilir tetiklemedigi icin (olculdu: 88 beklenen tetiklemeden 14'u
      # gerceklesti) botlari harici dispatch cagrilari ayakta tutuyor. O
      # kaynak durursa bu adim haber verir.
      - name: "Calistirma saglik kontrolu"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADIM_XAUUSD_botu: ${{ steps.xau.outcome }}
          ADIM_XAGUSD_botu: ${{ steps.xag.outcome }}
          ADIM_Donchian_hesap2: ${{ steps.donchian.outcome }}
          ADIM_AUDNZD_donus_hesap3: ${{ steps.audnzd.outcome }}
          ADIM_Ozet_hesap1: ${{ steps.ozet1.outcome }}
          ADIM_Ozet_hesap2: ${{ steps.ozet2.outcome }}
          ADIM_Ozet_hesap3: ${{ steps.ozet3.outcome }}
        run: python kosum_kontrol.py
